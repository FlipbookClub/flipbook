plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nativehighlightpdf'
version = '0.1.0'

android {
  namespace "expo.modules.nativehighlightpdf"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Same version react-native-pdf's Android side already depends on (see
  // node_modules/react-native-pdf/android/build.gradle) — Gradle resolves a
  // single copy, so no duplicate-native-library conflict between the two.
  implementation 'io.legere:pdfiumandroid:1.0.32'
}
