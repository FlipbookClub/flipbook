# S0-5. Typecheck, lint and test the app and the Convex backend.
# web/ has its own toolchain and is not installed or checked here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # This is the check name to mark as required on main.
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (app, Jest)
        run: npm run test:app -- --ci

      - name: Test (backend, Vitest)
        run: npm run test:convex
